<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌈 سرزمین نشانه‌ها | نشانه د</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<!-- صفحه شروع -->

<div id="startPage">

<h1>🌈 سرزمین نشانه‌ها 🌈</h1>

<h2>تثبیت آموزش نشانه «د»</h2>

<img
src="E3A460C6-A090-4050-8A2C-BED2517189E3.png"
class="teacher"
alt="معلم">

<h3>
☺️ نام قشنگت چیست؟
</h3>

<input
type="text"
id="studentName"
placeholder="نام خود را وارد کن">

<div class="genderBox">

<label>

<input
type="radio"
name="gender"
value="girl"
checked>

👧 دختر

</label>

<label>

<input
type="radio"
name="gender"
value="boy">

👦 پسر

</label>

</div>

<button id="startBtn">

🚀 شروع بازی

</button>

</div>

<!-- صفحه بازی -->

<div id="gamePage" style="display:none;">

<div class="topBar">

<div id="player">

<span id="avatar">👧</span>

<span id="showName"></span>

</div>

<div>

⭐ امتیاز :

<span id="score">

0

</span>

</div>

</div>

<h2 id="stageTitle">

مرحله اول

</h2>

<h2 id="question">

کدام کلمه با «د» شروع می‌شود؟

</h2>

<div id="options">

<button id="btn0" class="optionBtn"></button>

<button id="btn1" class="optionBtn"></button>

<button id="btn2" class="optionBtn"></button>

<button id="btn3" class="optionBtn"></button>

</div>

<div id="message"></div>

</div>

<!-- صفحه بین دو مرحله -->

<div id="stagePage" style="display:none;">

<h1>

🎉🌸🎉

</h1>

<h2>

آفرین

</h2>

<p>

👏🏻مرحله اول را با موفقیت تمام کردی.

</p>

<button id="stageBtn">

➡️ ورود به مرحله دوم

</button>

</div>

<!-- پایان بازی -->

<div id="finishPage" style="display:none;">

<h1>

🏆

</h1>

<h2 id="resultName"></h2>

<h3>

امتیاز نهایی

</h3>

<h1 id="finalScore"></h1>

<button id="restartBtn">

🔄 بازی دوباره

</button>

</div>

<footer>

A-I Based Education Content Creator

<br>

<strong>

:آموزگار پایه اوّل

مهندس مرضیه محمدی

</strong>

</footer>

</div>

<script src="script.js"></script>

</body>

</html>
